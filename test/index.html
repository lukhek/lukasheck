<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Marktanalyse | Lukas Heck</title><meta name="robots" content="noindex,nofollow"><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#f4f4f4;background:#101114}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,580px)}header{display:flex;justify-content:space-between;letter-spacing:.1em;font-size:12px;color:#aaa;margin-bottom:28px}.bar{display:flex;gap:7px;margin-bottom:36px}.bar i{height:4px;flex:1;background:#333;border-radius:5px}.bar i.on{background:#e6e6e6}h1{font-size:clamp(27px,5vw,39px);line-height:1.2;letter-spacing:-.03em;margin:0 0 12px}p{color:#aaa;line-height:1.6;margin:0 0 28px}.option{display:flex;align-items:center;gap:15px;width:100%;border:1px solid #393a40;background:#191a1e;color:#f5f5f5;border-radius:13px;padding:19px;text-align:left;font:inherit;cursor:pointer;margin:11px 0;transition:.15s}.option:hover,.option:focus-visible{border-color:#aaa;background:#26272c}.option span{display:grid;place-items:center;border-radius:7px;background:#303138;width:29px;height:29px;font-size:12px;flex-shrink:0}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px}button.back{background:none;color:#bbb;border:0;cursor:pointer;padding:10px;font:inherit}.note{font-size:12px;color:#888;margin-top:32px}a{color:#bbb}#message{color:#ffb5b5;min-height:20px;font-size:13px;margin-top:12px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head>
<body><main class="wrap"><header><span>LUKAS HECK / RESEARCH</span><span id="counter">01 / 03</span></header><div class="bar" aria-hidden="true"><i class="on"></i><i></i><i></i></div><section id="content" aria-live="polite"></section><div class="actions"><button class="back" id="back" type="button">← Zurück</button><span style="font-size:12px;color:#888">Dauer: ca. 20 Sekunden</span></div><div id="message" role="alert"></div><div class="note">Anonyme Testbefragung. Bitte keine persönlichen Gesundheitsdaten eingeben. <a href="/datenschutz.html">Datenschutz</a> · <a href="/impressum.html">Impressum</a></div></main>
<script>
const QUESTIONS=[{title:"Was ist dein wichtigstes Gesundheitsziel?",subtitle:"Wähle die Antwort, die am besten passt.",options:["Mehr Energie im Alltag","Besser schlafen","Langfristig gesund bleiben","Körperliche Leistungsfähigkeit"]},{title:"Wie viel investierst du monatlich in deine Gesundheit?",subtitle:"Eine grobe Einschätzung genügt.",options:["Unter 50 €","50–150 €","151–300 €","Über 300 €"]},{title:"Welche Unterstützung wäre für dich interessant?",subtitle:"Letzte Frage – danach bist du fertig.",options:["Persönliches Coaching","Digitale Tools und Analysen","Wissenschaftlich fundierte Informationen","Aktuell keine"]}];
let step=0,busy=false;const answers=[],content=document.getElementById("content"),back=document.getElementById("back"),message=document.getElementById("message");
function render(){message.textContent="";document.getElementById("counter").textContent=String(step+1).padStart(2,"0")+" / 03";document.querySelectorAll(".bar i").forEach((x,i)=>x.classList.toggle("on",i<=step));back.hidden=step===0;const q=QUESTIONS[step];content.replaceChildren();const h=document.createElement("h1");h.textContent=q.title;const p=document.createElement("p");p.textContent=q.subtitle;content.append(h,p);q.options.forEach((o,i)=>{const b=document.createElement("button");b.className="option";b.type="button";const k=document.createElement("span");k.textContent=String.fromCharCode(65+i);const label=document.createElement("strong");label.textContent=o;b.append(k,label);b.onclick=()=>choose(o);content.append(b)})}
async function choose(value){if(busy)return;answers[step]=value;if(step<2){step++;render();return}busy=true;content.querySelectorAll("button").forEach(b=>b.disabled=true);message.textContent="Antworten werden gespeichert …";try{const endpoint=window.SURVEY_ENDPOINT;if(!endpoint)throw new Error("Die Google-Sheets-Anbindung ist noch nicht eingerichtet.");const payload={goal:answers[0],budget:answers[1],support:answers[2],submissionId:crypto.randomUUID()};const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok||!result.ok)throw new Error("Speichern fehlgeschlagen.");content.innerHTML="<h1>Vielen Dank!</h1><p>Deine Antworten wurden gespeichert.</p>";document.querySelector(".actions").hidden=true;message.textContent="";}catch(e){message.textContent=e.message||"Übertragung fehlgeschlagen. Bitte erneut versuchen.";busy=false;content.querySelectorAll("button").forEach(b=>b.disabled=false)}}
back.onclick=()=>{if(step>0&&!busy){step--;render()}};render();
</script></body></html>
